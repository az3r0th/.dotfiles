cursor {
  no_hardware_cursors = true
}

general {
  gaps_in = 4
  gaps_out = 8
  border_size = 3
  col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
  col.inactive_border = rgba(595959aa)
  resize_on_border = true
  allow_tearing = false
  layout = dwindle
}

decoration {
  rounding = 15
  rounding_power = 2
  active_opacity = 1.0
  inactive_opacity = 1.0

  shadow {
    enabled = true
    range = 3
    render_power = 2
    color = rgba(00000088)
  }

  blur {
    enabled = true
    size = 4
    passes = 1
    vibrancy = 0.2
  }
}

animations {
  enabled = yes
  bezier = myBezier, 0.05, 0.9, 0.1, 1.05
  bezier = linear, 0, 0, 1, 1
  bezier = wind, 0.05, 0.9, 0, 1
  bezier = winIn, 0.1, 1.1, 0.1, 1.1
  bezier = winOut, 0.3, -0.3, 0, 1
  bezier = slow, 0, 0.85, 0.3, 1

  animation = windows, 1, 6, wind
  animation = windowsIn, 1, 6, winIn
  animation = windowsOut, 1, 5, winOut
  animation = windowsMove, 1, 5, wind
  animation = fade, 1, 10, slow
  animation = fadeIn, 1, 3, winIn
  animation = fadeOut, 1, 3, winOut
  animation = fadeSwitch, 1, 5, slow
  animation = fadeShadow, 1, 5, slow
  animation = fadeDim, 1, 4, slow
  animation = border, 1, 10, linear
  animation = borderangle, 1, 100, linear, loop
  animation = workspaces, 1, 5, wind
  animation = specialWorkspace, 1, 5, winIn
}

dwindle {
  pseudotile = true
  preserve_split = true
}

master {
  new_status = master
}

misc {
  force_default_wallpaper = 0
  disable_hyprland_logo = true
  focus_on_activate = true
  mouse_move_enables_dpms = true
  key_press_enables_dpms = true
  disable_splash_rendering = false
  animate_manual_resizes = true
  animate_mouse_windowdragging = true
  enable_swallow = true
  swallow_regex = ^(ghostty)$
  swallow_exception_regex = ^(wev)$
}
